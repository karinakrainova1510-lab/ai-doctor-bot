<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Doctor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF4F1;--card:#fff;--ink:#10302E;--mut:#5E7A76;--acc:#17806F;--soft:#D7E9E3;--red:#C8374B;--line:#D3E0DB}
*{box-sizing:border-box;margin:0}html,body{height:100%}body{font:16px/1.45 Onest,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
main{flex:1;overflow-y:auto;padding:16px 16px 8px}nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 0 8px;font:500 12px Onest,sans-serif;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}nav button span{font-size:22px}nav .on{color:var(--acc);font-weight:700}
h2{font-size:22px;margin-bottom:4px}p.s{color:var(--mut);font-size:14px;margin-bottom:12px}.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);margin-bottom:8px}label{font-size:13px;color:var(--mut);display:block;margin-bottom:3px}
.btn{width:100%;border:0;border-radius:12px;padding:13px;font:700 16px Onest,sans-serif;background:var(--acc);color:#fff}.btn:disabled{opacity:.5}.btn.ghost{background:var(--soft);color:var(--ink)}.btn.del{background:none;color:var(--red);font-weight:500;font-size:14px}
.row{display:flex;gap:8px}.row>*{flex:1}.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px}.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 13px;font:14px Onest,sans-serif;color:var(--ink)}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.msg{max-width:92%;padding:10px 13px;border-radius:14px;margin-bottom:10px;font-size:15px;word-wrap:break-word}.me{background:var(--acc);color:#fff;margin-left:auto;border-bottom-right-radius:4px}.bot{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}.bot ul{padding-left:20px;margin:4px 0}.bot b{font-weight:700}
.bar{display:flex;gap:8px;padding:8px 12px;background:var(--card);border-top:1px solid var(--line)}.bar input{margin:0}.bar button{flex:none;width:46px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:20px}
.rec{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.rec b{display:block}.rec small{color:var(--mut)}.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:10px}
.pay{background:var(--ink);color:#fff;border:0}.pay p{color:#B9D4CE}.note{font-size:12px;color:var(--mut);text-align:center;padding:8px 16px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:4px;animation:b 1s infinite}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}@keyframes b{50%{opacity:.2}}@media(prefers-reduced-motion:reduce){.dot{animation:none}}.hide{display:none!important}
</style></head><body>
<main id="main"></main>
<div class="bar hide" id="bar"><input id="q" placeholder="Спросите о здоровье, питании…" enterkeyhint="send"><button id="send" aria-label="Отправить">➤</button></div>
<div class="note">AI Doctor не заменяет врача. При острой боли, одышке, потере сознания — звоните 103/112.</div>
<nav id="nav"></nav><input type="file" id="file" accept="image/*" multiple class="hide">
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const KINDS={sugar:["🩸","Сахар","ммоль/л, напр. 5.6"],pressure:["❤️","Давление","напр. 120/80"],pulse:["💓","Пульс","уд/мин"],weight:["⚖️","Вес","кг"],temp:["🌡️","Температура","°C"],lab:["🧪","Анализы","результаты или ссылка на показатели"],mri:["🧲","МРТ","заключение врача"],ct:["☢️","КТ","заключение врача"],us:["📡","УЗИ","заключение врача"],other:["📋","Другое","описание"]};
const TABS=[["chat","💬","Врач"],["scan","📷","Анализ"],["diary","📒","Дневник"],["me","👤","Профиль"]];
let S={},tab="chat",chat=[],recs=[],imgs=[],kind="sugar",busy=false;
const $=s=>document.querySelector(s),today=()=>new Date().toISOString().slice(0,10);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^#+\s*(.+)$/gm,"<b>$1</b>").replace(/^[-•]\s+(.+)$/gm,"<li>$1</li>").replace(/(<li>.*<\/li>\n?)+/g,m=>"<ul>"+m+"</ul>").replace(/\n/g,"<br>");
async function api(p,b,m){const r=await fetch("/api/"+p,{method:m||(b?"POST":"GET"),headers:{"X-Init":tg.initData,"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});
if(r.status==402){go("me");tg.showAlert("Бесплатный лимит закончился. Оформите подписку в профиле.");throw 0}
if(!r.ok){let msg="Что-то пошло не так. Попробуйте ещё раз.";try{const e=await r.json();if(e.message)msg=e.message}catch{}tg.showAlert(msg);throw 0}return r.json()}
function go(t){tab=t;render()}
function render(){$("#nav").innerHTML=TABS.map(([k,i,n])=>`<button class="${k==tab?"on":""}" onclick="go('${k}')"><span>${i}</span>${n}</button>`).join("");$("#bar").classList.toggle("hide",tab!="chat");const m=$("#main");({chat:vChat,scan:vScan,diary:vDiary,me:vMe})[tab](m);if(tab=="chat")m.scrollTop=m.scrollHeight}
function vChat(m){const chips=["Расшифруй мои последние анализы","Что мне есть при моих показателях?","Сделай общую сводку по дневнику","Какие витамины и травы мне подойдут?"];m.innerHTML=(chat.length?"":`<h2>Здравствуйте 👋</h2><p class="s">Я учитываю ваш профиль и дневник. Выберите вопрос или напишите свой.</p>${S.active?"":`<p class="s">Бесплатных вопросов: ${S.free_chat}, бесплатных анализов по фото: ${S.free_analyses}</p>`}<div class="chips" style="flex-wrap:wrap">${chips.map(c=>`<button class="chip" onclick="ask(this.textContent)">${c}</button>`).join("")}</div>`)+chat.map(c=>`<div class="msg ${c.role=="user"?"me":"bot"}">${c.role=="user"?esc(c.text):md(c.text)}</div>`).join("")+(busy?`<div class="msg bot"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>`:"")}
async function ask(t){t=(t||$("#q").value).trim();if(!t||busy)return;$("#q").value="";chat.push({role:"user",text:t});busy=true;render();try{const r=await api("chat",{text:t});chat.push({role:"assistant",text:r.text});S={...S,...r}}catch(e){chat.pop()}busy=false;render()}
function vScan(m){m.innerHTML=`<h2>Расшифровка анализов</h2><p class="s">Сфотографируйте бланк или заключение. До 4 фото. Результат сохранится в дневник.</p><div class="chips">${["lab","mri","ct","us","other"].map(k=>`<button class="chip ${k==kind?"on":""}" onclick="kind='${k}';render()">${KINDS[k][0]} ${KINDS[k][1]}</button>`).join("")}</div><div class="thumbs">${imgs.map(i=>`<img src="data:image/jpeg;base64,${i}">`).join("")}</div><button class="btn ghost" onclick="$('#file').click()" style="margin-bottom:8px">📷 ${imgs.length?"Добавить ещё фото":"Выбрать фото"}</button><label>Дата исследования</label><input type="date" id="d" value="${today()}"><label>Комментарий (необязательно)</label><input id="n" placeholder="Что беспокоит, когда сдавали"><button class="btn" id="go" ${imgs.length&&!busy?"":"disabled"} onclick="analyze()">${busy?"Анализирую…":"Расшифровать"}</button><div id="res" style="margin-top:14px"></div>`}
$("#file").onchange=async e=>{for(const f of [...e.target.files].slice(0,4-imgs.length))imgs.push(await shrink(f));e.target.value="";render()};
function shrink(f){return new Promise(ok=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.82).split(",")[1])};i.src=URL.createObjectURL(f)})}
async function analyze(){busy=true;const b={kind,date:$("#d").value||today(),note:$("#n").value,images:imgs};render();try{const r=await api("analyze",b);S={...S,...r};imgs=[];busy=false;recs=await api("records");render();}catch(e){busy=false;render()}}
function vDiary(m){m.innerHTML=`<h2>Дневник здоровья</h2><p class="s">Чем больше данных, тем точнее советы. Врач анализирует всё вместе.</p><div class="card"><div class="chips">${Object.keys(KINDS).map(k=>`<button class="chip ${k==kind?"on":""}" onclick="kind='${k}';render()">${KINDS[k][0]} ${KINDS[k][1]}</button>`).join("")}</div><label>${KINDS[kind][1]}</label><${["mri","ct","us","lab","other"].includes(kind)?"textarea rows=3":"input"} id="v" placeholder="${KINDS[kind][2]}" ${["sugar","pulse","weight","temp"].includes(kind)?'inputmode="decimal"':""}>${["mri","ct","us","lab","other"].includes(kind)?"</textarea>":""}<div class="row"><div><label>Дата</label><input type="date" id="d" value="${today()}"></div><div><label>Заметка</label><input id="n" placeholder="натощак, после еды…"></div></div><button class="btn" onclick="addRec()">Сохранить запись</button></div>${recs.length?"":`<p class="s">Пока пусто. Добавьте первое измерение, например сахар или давление.</p>`}${recs.map(r=>`<div class="card rec"><div><b>${(KINDS[r.kind]||KINDS.other)[0]} ${(KINDS[r.kind]||KINDS.other)[1]}: ${esc(r.value)}</b><small>${r.date}${r.note?" · "+esc(r.note):""}</small>${r.ai?`<details style="margin-top:6px"><summary style="color:var(--acc)">Расшифровка</summary><div style="margin-top:6px;font-size:14px">${md(r.ai)}</div></details>`:""}</div><button class="btn del" style="width:auto;padding:0" onclick="delRec(${r.id})">✕</button></div>`).join("")}`}
async function addRec(){const v=$("#v").value.trim();if(!v){tg.showAlert("Введите значение");return}await api("records",{kind,value:v,note:$("#n").value,date:$("#d").value||today()});recs=await api("records");tg.HapticFeedback.notificationOccurred("success");render()}
async function delRec(id){tg.showConfirm("Удалить запись?",async ok=>{if(ok){await api("records",{id},"DELETE");recs=await api("records");render()}})}
function vMe(m){const p=S.profile||{},d=S.sub_until?new Date(S.sub_until*1000).toLocaleDateString("ru"):"";const F=(k,l,ph)=>`<label>${l}</label><input id="p_${k}" value="${esc(p[k]||"")}" placeholder="${ph||""}">`;m.innerHTML=`<div class="card pay"><h2>${S.active?"Подписка активна":"AI Doctor Premium"}</h2><p class="s">${S.active?"До "+d:`Безлимитные анализы, вопросы и память. ${S.price} ⭐ в месяц.<br>Бесплатно осталось: анализов ${S.free_analyses}, вопросов ${S.free_chat}.`}</p>${S.active?"":`<button class="btn" onclick="pay()">Оформить за ${S.price} ⭐</button>`}</div><h2>Обо мне</h2><p class="s">Эти данные помогают давать точные советы и учитывать противопоказания.</p><div class="card"><div class="row"><div>${F("age","Возраст")}</div><div><label>Пол</label><select id="p_sex"><option value="">—</option><option ${p.sex=="Женский"?"selected":""}>Женский</option><option ${p.sex=="Мужской"?"selected":""}>Мужской</option></select></div></div><div class="row"><div>${F("height","Рост, см")}</div><div>${F("weight","Вес, кг")}</div></div>${F("conditions","Хронические болезни","диабет, гипертония…")}${F("allergies","Аллергии","на что и какая реакция")}${F("meds","Принимаю лекарства и добавки","название, как давно")}${F("notes","Другое","беременность, диета, цели")}<button class="btn" onclick="saveP()">Сохранить</button></div><button class="btn del" onclick="wipe()">Удалить все мои данные</button>`}
async function saveP(){const p={sex:$("#p_sex").value};["age","height","weight","conditions","allergies","meds","notes"].forEach(k=>p[k]=$("#p_"+k).value);await api("profile",p);S.profile=p;tg.HapticFeedback.notificationOccurred("success");tg.showAlert("Сохранено")}
function pay(){api("invoice",{}).then(r=>tg.openInvoice(r.link,async st=>{if(st=="paid"){await new Promise(r=>setTimeout(r,1500));S=await api("me");render()}}))}
function wipe(){tg.showConfirm("Удалить профиль, дневник и историю чата безвозвратно?",async ok=>{if(ok){await api("wipe",{});chat=[];recs=[];S=await api("me");render()}})}
$("#send").onclick=()=>ask();$("#q").onkeydown=e=>{if(e.key=="Enter")ask()};
(async()=>{try{[S,recs,chat]=await Promise.all([api("me"),api("records"),api("history")])}catch(e){}render()})();
</script></body></html>
